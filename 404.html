<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>NC Bulls Cricket Club</title>
    <script>
      // Redirect any unknown path back to the root hash route
      // e.g. /news/article -> /#/news/article
      var path = window.location.pathname;
      var search = window.location.search;
      window.location.replace(
        window.location.origin + '/#' + path + search
      );
    </script>
  </head>
  <body></body>
</html>
