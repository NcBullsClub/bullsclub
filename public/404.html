<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>NC Bulls Cricket Club</title>
    <script>
      // Encode the path into the query string so index.html can restore it.
      // e.g. /news/my-article  →  /?/news/my-article
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        '/?/' +
        l.pathname.slice(1).replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
