<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>NC Bulls Cricket Club</title>
    <script>
      // GitHub Pages SPA redirect trick
      // Store the full URL and redirect to the root so index.html loads,
      // then the script in index.html restores the original path for React Router.
      sessionStorage.setItem('spa-redirect', window.location.href);
      window.location.replace('/');
    </script>
  </head>
  <body></body>
</html>
